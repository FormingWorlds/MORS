# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The vendored OFL text and the test-written validation SVGs keep their
      # bytes. A test asserts that every exclude matches a tracked file.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(docs/stylesheets/fonts/OFL\.txt|docs/assets/validation/.*\.svg)$
      - id: end-of-file-fixer
        exclude: ^docs/stylesheets/fonts/OFL\.txt$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: check-agents-md
        name: Check agent instruction files
        entry: python tools/agents/check_agents_md.py
        language: system
        files: (AGENTS\.md|CLAUDE\.md|copilot-instructions\.md)$
        pass_filenames: false
