name: MORS nightly

on:
  schedule:
    # 03:00 UTC daily.
    - cron: '0 3 * * *'
  # Manual trigger for ad-hoc runs via
  # ``gh workflow run "MORS nightly" -r <branch>``.
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents. Coverage
# upload uses the CODECOV_TOKEN secret directly, not the default GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: full test suite (unit + smoke + integration + slow) with coverage
# instrumentation. The PR gate runs only the unit + smoke tiers; the
# integration and slow tiers run the real Baraffe / Spada evolution model,
# which needs the track data under FWL_DATA and takes minutes. Coverage is
# reported to the Codecov dashboard via codecov-action.
jobs:
  nightly:
    name: MORS-nightly (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MORS
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[develop]"

      # fwl-io builds the key from the folders, checksums and extract kinds
      # the manifest pins plus its own release, and picks the restore-keys.
      - name: Resolve the track-data cache key
        id: cachekey
        run: fwl-io cache key --prefix mors-fwl-data- --provider mors

      - name: Cache evolution-track data
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/fwl_data
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: ${{ steps.cachekey.outputs.restore-keys }}

      # actions/cache never saves over an entry it hit, so the tree is
      # completed and checked on every run, before the save.
      - name: Fetch and check the track data
        run: |
          fwl-io cache fetch --provider mors --data-root ${{ github.workspace }}/fwl_data
          fwl-io cache check --provider mors --data-root ${{ github.workspace }}/fwl_data

      - name: Run unit + smoke + integration + slow tests with coverage
        env:
          FWL_DATA: ${{ github.workspace }}/fwl_data
        run: |
          FULL_FAIL_UNDER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['coverage']['report']['fail_under'])")
          echo "Full gate fail_under: ${FULL_FAIL_UNDER}%"
          # -rs prints the reason behind every skip. A check that stood down
          # because an upstream service was unavailable otherwise shows up as a
          # bare count and reads as if it had run.
          pytest -m "(unit or smoke or integration or slow) and not skip" \
            -rs \
            --junit-xml=report.xml \
            --cov=mors \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${FULL_FAIL_UNDER}

      # A check that did not run leaves the run green, so it is raised to the
      # run summary here rather than left in the body of a long log.
      - name: Report checks that did not run
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET

          # A marker-deselected test leaves no element in the report at all, so
          # these are looked for by name rather than waited on to appear.
          MUST_RUN = {
              'tests.test_data_live.test_committed_registry_matches_live_zenodo[star.tracks.baraffe_2015]',
              'tests.test_data_live.test_committed_registry_matches_live_zenodo[star.tracks.spada_2013]',
          }

          # An unreadable report earns a warning rather than a failure, since it
          # means the run was killed before it finished writing one.
          try:
              root = ET.parse(pathlib.Path('report.xml')).getroot()
          except (OSError, ET.ParseError) as exc:
              print(f'::warning::the test report could not be read ({exc}), so any '
                    'check that did not run is unreported')
              raise SystemExit(0)

          ran = set()
          for case in root.iter('testcase'):
              name = f'{case.get("classname", "")}.{case.get("name", "")}'.strip('.')
              ran.add(name)
              for skipped in case.iter('skipped'):
                  # Collapsing whitespace keeps a reason from carrying a line
                  # break into the annotation, where it would start a new one.
                  reason = ' '.join((skipped.get('message') or 'no reason given').split())
                  print(f'::warning::{name} did not run: {reason}')

          missing = sorted(MUST_RUN - ran)
          for name in missing:
              print(f'::error::{name} is absent from the test report, so it was '
                    'deselected or renamed rather than run')
          raise SystemExit(1 if missing else 0)
          PY

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/MORS
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false
